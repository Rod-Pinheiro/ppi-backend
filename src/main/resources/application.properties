spring.application.name=ppi

# Docker Compose fora do processo Spring: o daemon exige sudo e o Gradle nao
# consegue responder a um prompt. Suba o banco com `sudo docker compose up -d`.
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD:secret}

# O Flyway e dono do schema; o Hibernate apenas valida contra as migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
